services:
  - type: web
    name: cycloneshield-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: APP_MODE
        value: demo
      - key: PRIMARY_LLM_PROVIDER
        value: granite
      - key: IBM_GRANITE_API_KEY
        sync: false
      - key: IBM_GRANITE_PROJECT_ID
        sync: false
      - key: IBM_GRANITE_URL
        value: https://us-south.ml.cloud.ibm.com
